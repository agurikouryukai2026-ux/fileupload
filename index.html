<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイルアップロード</title>

<style>
html,body{
 margin:0;
 padding:0;
 height:100%;
 overflow:hidden;
}

iframe{
 width:100%;
 height:100%;
 border:0;
}
</style>

</head>

<body>

<iframe id="app"></iframe>


<script>

const params =
new URLSearchParams(
 location.search
);


const type =
params.get('type');


// type指定がない場合はエラー表示
if(!type){

 document.body.innerHTML =
 `
 <div style="
 padding:30px;
 font-family:sans-serif;
 ">
 <h2>アップロードページエラー</h2>
 <p>
 アップロード種類が指定されていません。
 </p>
 </div>
 `;

}
else{


 const gasUrl =
 'https://script.google.com/macros/s/AKfycbxYlJWl525oA8-_HNrAB6sRITJB-yDhjjDBsc_krj04e83h1gXBMrdyOPyxN4HGiBOM/exec?type='
 +
 encodeURIComponent(type);



 document
 .getElementById('app')
 .src =
 gasUrl;


}

</script>

</body>
</html>
