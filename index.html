<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">

<title>Redirect...</title>

<script>

new URLSearchParams(

);

params.get("type");

GAS_URL +
"?authuser=0&type=" +
encodeURIComponent(type);

</script>

</head>
